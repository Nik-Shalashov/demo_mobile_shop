name: demo_mobile_shop
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_localization: ^1.0.0

  # DI
  get_it: ^9.3.0
  provider: ^6.1.5+1

  # Architecture
  ## Presentation
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  go_router: ^18.1.4

  ## Data
  ### Network
  dio: ^5.11.1
  awesome_dio_interceptor: ^1.3.0
  retrofit: ^4.10.0
  ### Json Serialization
  json_annotation: ^4.12.0

  # Extensions
  dartx: 1.2.0
  rxdart: 0.28.0

  # UI
  animations: 2.2.0
  flutter_svg: ^2.5.0

  # Utils
  equatable: 2.0.8
  path: any # resolved by Flutter
  meta: any # resolved by Flutter
  intl: any # resolved by Flutter
  collection: any # resolved by Flutter
  web: any # resolver by Flutter

  # Plugins
  shared_preferences: ^2.5.6
  connectivity_plus: ^7.3.2
  hive: ^2.2.3

  # Dev
  logger: ^2.8.0
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  #Codegen
  build_runner: 2.15.1
  flutter_gen_runner: 5.14.1
  retrofit_generator: 10.2.6
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_24pt-Regular.ttf

flutter_gen:
  output: lib/ui/resources
  assets:
    enabled: true
  fonts:
    enabled: true
  integrations:
    image: false
    flutter_svg: false
    rive: false
    lottie: false
